[Service]
# Beispiel: alternative Konfig verwenden (z.B. staging/local)
# Environment="GHVSHORT_CONFIG=/etc/ghvshort/config.local.toml"

# Beispiel: Startparameter überschreiben (Port/Host)
# Wichtig: Bei ExecStart-Override muss zuerst "ExecStart=" stehen, um die alte Zeile zu löschen.
# ExecStart=
# ExecStart=/usr/bin/ghvshort serve --host 127.0.0.1 --port 8731

# Beispiel: bei Bedarf restriktiver/lockerer Neustartverhalten anpassen
# Restart=on-failure
# RestartSec=2s
