[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghvshort"
version = "0.1.0"
description = "Minimaler Vereins-Linkshortener mit FastAPI + SQLite"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.92",
  "uvicorn>=0.20",
  "typer>=0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8.4",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "httpx>=0.27",
]

[project.scripts]
ghvshort = "ghvshort.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "debian",
  "build",
  "dist",
  ".debian",
  ".debhelper",
]

[tool.ruff.lint]
select = [
  "E", "F", "W",    # pycodestyle/pyflakes
  "I",              # import sorting
  "UP",             # pyupgrade
  "B",              # bugbear
  "SIM",            # simplify
]
ignore = [
  "E501",           # line length handled by formatter / pragmatic
]

[tool.ruff.lint.per-file-ignores]
"ghvshort/cli.py" = ["UP"]   # Debian/typer: cli-signatures must use Optional
"ghvshort/db.py" = ["UP"]   # Debian/typer: cli-signatures must use Optional
"ghvshort/web.py" = ["UP"]   # Debian/typer: cli-signatures must use Optional

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["ghvshort*"]
exclude = ["etc*", "lib*", "share*", "debian*", "nginx*", "tests*"]
